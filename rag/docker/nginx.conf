# DuoWallet — nginx: situs statis + proxy Ollama & layanan RAG (same-origin, bebas CORS)
upstream ollama_backend {
    server host.docker.internal:11434;
    server ollama:11434 backup;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nonaktifkan cache browser untuk file statis agar perubahan JS/HTML langsung aktif
    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
        try_files $uri =404;
    }

    # Proxy API Ollama same-origin (frontend memanggil /api/chat & /api/tags)
    location /api/ {
        proxy_pass http://ollama_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Proxy ke Ollama di dalam jaringan compose (frontend memanggil /ollama/api/chat)
    location /ollama/ {
        proxy_pass http://ollama_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Proxy ke layanan RAG (frontend memanggil /rag/query)
    location /rag/ {
        proxy_pass http://rag:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
