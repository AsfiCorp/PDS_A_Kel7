# =============================================================
# DuoWallet + DuoAI — Paket Deployment Docker (Instruksi Dosen)
# Arsitektur: web (nginx, situs statis + proxy) -> ollama (LLM
# duoai-copilot + embedding nomic-embed-text) + rag (retriever)
# Jalankan:  docker compose up --build
# Buka:      http://localhost:8080
# Opsional (Pertemuan 6 / Module 12 — vector store):
#   docker compose --profile opensearch up -d
# =============================================================
services:
  ollama:
    image: ollama/ollama:latest
    container_name: duoai-ollama
    volumes:
      - ollama_models:/root/.ollama
      - ./doc/Modelfile:/Modelfile.duoai:ro
      - ./docker/init-ollama.sh:/init-ollama.sh:ro
    entrypoint: ["/bin/sh", "/init-ollama.sh"]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    # UNCOMMENT untuk mengekspos Ollama langsung ke host (opsional):
    # ports:
    #   - "11435:11434"

  rag:
    build:
      context: .
      dockerfile: docker/Dockerfile.rag
    container_name: duoai-rag
    environment:
      PYTHONUNBUFFERED: "1"
      OLLAMA_HOST: http://ollama:11434
      EMBED_MODEL: nomic-embed-text
      # Module 15 & 16: dinaikkan dari 3 ke 5 (mitigasi cosine ranking score rapat)
      RAG_TOP_K: "5"
      # Screenshot Pak Ilham & Module 14: nala-academic-docs
      OPENSEARCH_INDEX: nala-academic-docs
      OPENSEARCH_BASE_URL: http://opensearch:9200
    volumes:
      # Module 13-16: code class VectorStore & KB bind-mount
      - ./rag_engine.py:/app/rag_engine.py:ro
      - ./app:/app/app:ro
      - ./knowledge-base:/app/knowledge-base:ro
      - ./.rag_index_cache.json:/app/.rag_index_cache.json
      - ./doc/PANDUAN_PENGGUNA.md:/app/PANDUAN_PENGGUNA.md:ro
      - ./doc/JOBDESK.md:/app/JOBDESK.md:ro
      - ./doc/LAPORAN_STRATEGI_TRAINING_DUOAI.md:/app/LAPORAN_STRATEGI_TRAINING_DUOAI.md:ro
      - ./duoai_training_dataset.jsonl:/app/duoai_training_dataset.jsonl:ro
    depends_on:
      ollama:
        condition: service_started
    # Tidak diekspos ke host; diakses via proxy nginx /rag/

  web:
    image: nginx:alpine
    container_name: duoai-web
    volumes:
      - ./websitekeuangan-v2:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - ollama
      - rag

  # ---- Pertemuan 6 / Module 12 (opsional): vector store OpenSearch ----
  # Profil terpisah karena RAM VM Docker 4GB (doc sarankan 16GB).
  # Heap 512m sesuai doc; naikkan ke 1g kalau VM dinaikkan ke 8GB+.
  opensearch:
    profiles: [opensearch]
    image: opensearchproject/opensearch:2.11.0
    container_name: duoai-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  opensearch-dashboards:
    profiles: [opensearch]
    image: opensearchproject/opensearch-dashboards:2.11.0
    container_name: duoai-opensearch-dashboards
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    depends_on:
      - opensearch

volumes:
  ollama_models:
  opensearch_data:
