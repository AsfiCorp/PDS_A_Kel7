<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <title>DuoWallet — Personal & Collab Finance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- Global Controls: Desktop/Mobile Switcher & Language Switcher -->
    <header class="app-global-controls" aria-label="App Controls">
      <div class="controls-group">
        <button id="btn-toggle-view" class="control-pill-btn" onclick="UI.toggleViewMode()" title="Switch between Desktop and Mobile view">
          <span class="material-symbols-rounded" id="icon-view-mode">desktop_windows</span>
          <span id="lbl-view-mode">Tampilan Desktop</span>
        </button>
        <button id="btn-toggle-lang" class="control-pill-btn" onclick="UI.toggleLanguage()" title="Ganti Bahasa / Switch Language">
          <span class="lang-flag" id="lbl-lang-flag">🇮🇩</span>
          <span id="lbl-lang-code">ID</span>
        </button>
      </div>
    </header>

    <main class="prototype-frame" id="prototype-frame" aria-label="DuoWallet App Frame">
      <!-- Screen Viewport -->
      <div id="screen-container" class="screen-container"></div>

      <!-- Bottom / Sidebar Navigation (Screens S12–S44) -->
      <nav id="bottom-nav" class="bottom-nav hidden" aria-label="Main Navigation">
        <!-- Desktop Nav Header (Visible only in desktop mode) -->
        <div class="desktop-nav-brand">
          <div class="duo-mark-mini">
            <span class="ring ring--rina"></span>
            <span class="ring ring--dimas"></span>
          </div>
          <div>
            <strong class="desktop-brand-title">DuoWallet</strong>
            <span class="desktop-brand-sub">Smart Ledger</span>
          </div>
        </div>

        <button id="nav-personal" class="bottom-nav-item active" onclick="Router.navigate('S12')">
          <span class="material-symbols-rounded">person</span>
          <span data-i18n="personal">Pribadi</span>
        </button>
        <button id="nav-collab" class="bottom-nav-item" onclick="Router.navigate('S26')">
          <span class="material-symbols-rounded">group</span>
          <span data-i18n="collab">Bersama</span>
        </button>
        <button id="nav-budgets" class="bottom-nav-item" onclick="Router.navigate('S19')">
          <span class="material-symbols-rounded">pie_chart</span>
          <span data-i18n="budgets">Anggaran</span>
        </button>
        <button id="nav-wallets" class="bottom-nav-item" onclick="Router.navigate('S34')">
          <span class="material-symbols-rounded">account_balance_wallet</span>
          <span data-i18n="wallets">Dompet</span>
        </button>
        <button id="nav-more" class="bottom-nav-item" onclick="Router.navigate('S40')">
          <span class="material-symbols-rounded">menu</span>
          <span data-i18n="more">Lainnya</span>
        </button>

        <!-- Desktop Quick Status Widget -->
        <div class="desktop-quick-widget">
          <div class="quick-widget-header">
            <span class="material-symbols-rounded text-teal">shield</span>
            <span class="text-xs font-bold" data-i18n="safeToSpend">Aman Belanja</span>
          </div>
          <div class="quick-widget-amount" id="desktop-safe-spend">Rp 180.000<span class="text-xs">/hari</span></div>
          <div class="desktop-widget-debt" id="desktop-debt-info" onclick="Router.navigate('S30')">
            <span class="material-symbols-rounded icon-xs text-orange">balance</span>
            <span>Dimas: <strong>Rp 320.000</strong></span>
          </div>
        </div>
      </nav>

      <!-- Floating AI Advisor FAB Button -->
      <button id="ai-fab-btn" class="ai-fab-button" onclick="UI.toggleAiChat()" aria-label="Buka DuoAI Penasihat Finansial" title="DuoAI Financial Advisor" style="display: none;">
        <div class="ai-fab-pulse"></div>
        <span class="material-symbols-rounded ai-fab-icon">auto_awesome</span>
        <span class="ai-fab-badge">DuoAI</span>
      </button>

      <!-- AI Financial Advisor Drawer -->
      <div id="ai-chat-backdrop" class="ai-backdrop" onclick="UI.closeAiChat()"></div>
      <aside id="ai-chat-drawer" class="ai-drawer" aria-label="AI Financial Advisor">
        <div class="ai-drawer-header">
          <div class="ai-header-left">
            <div class="ai-avatar">
              <span class="material-symbols-rounded">auto_awesome</span>
            </div>
            <div>
              <h3 id="ai-drawer-title">DuoAI Penasihat Finansial</h3>
              <div class="ai-status-row">
                <span class="ai-status-dot"></span>
                <p id="ai-drawer-sub" class="ai-sub">Online • Analisis Finansial Cerdas</p>
              </div>
            </div>
          </div>
          <button class="icon-btn ai-close-btn" onclick="UI.closeAiChat()" aria-label="Tutup Chat AI">
            <span class="material-symbols-rounded">close</span>
          </button>
        </div>

        <div id="ai-chat-messages" class="ai-messages-container"></div>

        <div class="ai-quick-prompts-wrapper">
          <span class="quick-prompts-label" id="ai-quick-label">Saran Cepat:</span>
          <div class="ai-chips-scroll" id="ai-quick-chips"></div>
        </div>

        <form class="ai-input-form" onsubmit="event.preventDefault(); UI.handleAiSubmit();">
          <input type="text" id="ai-user-input" class="ai-input" placeholder="Tanya tentang keuanganmu..." autocomplete="off" />
          <button type="submit" class="ai-send-btn" aria-label="Kirim">
            <span class="material-symbols-rounded">arrow_upward</span>
          </button>
        </form>
      </aside>

      <!-- Bottom Sheet Overlays (C01–C23) -->
      <div id="overlay-backdrop" class="overlay-backdrop" onclick="Router.closeOverlay()"></div>
      <div id="overlay-container" class="overlay-container"></div>

      <!-- Modal Dialogs (D01–D23) -->
      <div id="dialog-backdrop" class="dialog-backdrop" onclick="Router.closeDialog()"></div>
      <div id="dialog-container" class="dialog-container"></div>

      <!-- Toast Notification Bar -->
      <div id="toast-notification" class="toast-notification" role="alert"></div>
    </main>

    <!-- Desktop App Shell (Active when viewport >= 1024px or Desktop mode toggled) -->
    <div id="desktop-app-shell" class="desktop-app-shell" style="display: none;" aria-label="DuoWallet Desktop Shell">
      <!-- Desktop Sidebar -->
      <aside id="desktop-sidebar-container" class="desktop-sidebar" aria-label="Desktop Sidebar"></aside>

      <!-- Desktop Main Viewport -->
      <div class="desktop-main-wrapper">
        <header id="desktop-header-container" class="desktop-header" aria-label="Desktop Top Header"></header>
        <main id="desktop-content-container" class="desktop-content-area" aria-label="Desktop Content"></main>
      </div>

      <!-- Desktop AI Side Panel -->
      <aside id="desktop-ai-panel" class="desktop-ai-panel" aria-label="DuoAI Side Panel">
        <div class="desk-ai-head">
          <div class="flex items-center gap-2">
            <div class="ai-avatar"><span class="material-symbols-rounded">auto_awesome</span></div>
            <div>
              <strong>DuoAI Copilot</strong>
              <span class="text-xs text-secondary block">Financial Assistant</span>
            </div>
          </div>
          <button type="button" class="icon-btn" onclick="DesktopShell.toggleAi()"><span class="material-symbols-rounded">close</span></button>
        </div>
        <div id="desk-ai-messages" class="desk-ai-messages-scroll"></div>
        <div class="desk-ai-prompts-bar">
          <div id="desk-ai-quick-chips" class="desk-ai-chips-flex"></div>
        </div>
        <form class="desk-ai-input-form" onsubmit="event.preventDefault(); DesktopShell.handleAiSubmit();">
          <input type="text" id="desk-ai-input" class="desk-ai-input" placeholder="Tanya tentang keuanganmu..." autocomplete="off" />
          <button type="submit" class="ai-send-btn" aria-label="Kirim"><span class="material-symbols-rounded">arrow_upward</span></button>
        </form>
      </aside>
    </div>

    <!-- Logic & Screen Scripts -->
    <script src="./state.js"></script>
    <script src="./layout.js"></script>
    <script src="./desktop.js"></script>
    <script src="./screens_auth.js"></script>
    <script src="./screens_personal.js"></script>
    <script src="./screens_collab.js"></script>
    <script src="./screens_system.js"></script>
    <script src="./admin.js"></script>
    <script src="./components_overlays.js"></script>
    <script src="./app.js?v=20261104_3" defer></script>
  </body>
</html>
